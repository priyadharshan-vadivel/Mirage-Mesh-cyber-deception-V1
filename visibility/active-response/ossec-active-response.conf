<!--
  Mirage Mesh — Wazuh active-response wiring.
  Add these two blocks INSIDE <ossec_config> in /var/ossec/etc/ossec.conf on the
  MANAGER, then restart wazuh-manager.

  This makes every decoy alert invoke the orchestration handler, which logs +
  notifies. It keys on the shared "mirage_mesh" group carried by EVERY rule in
  mirage_mesh_rules.xml (via the enclosing <group name="mirage_mesh,...">), not
  on the base rule's own group: when a per-layer child rule (100201-100204)
  fires it becomes the triggered rule and does NOT inherit the base rule's
  group, so keying on the base-only group would never match. The handler
  receives the full alert as JSON on stdin (Wazuh AR contract).

  PoC scope: the response is log + notify ONLY. No IP blocking. To add blocking
  later (production), point a second <active-response> at the firewall-drop
  command for the same group — a pure addition, no change here.
-->

<command>
  <name>mirage-orchestrate</name>
  <executable>mirage-orchestrate.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<active-response>
  <command>mirage-orchestrate</command>
  <location>local</location>
  <rules_group>mirage_mesh</rules_group>
</active-response>
