<!--
  Mirage Mesh — Wazuh active-response wiring.
  Add these two blocks INSIDE <ossec_config> in /var/ossec/etc/ossec.conf on the
  MANAGER, then restart wazuh-manager.

  This makes every decoy alert (base rule 100200, group mirage_mesh_decoy)
  invoke the orchestration handler, which logs + notifies. The handler receives
  the full alert as JSON on stdin (Wazuh AR contract).

  PoC scope: the response is log + notify ONLY. No IP blocking. To add blocking
  later (production), point a second <active-response> at the firewall-drop
  command for the same group — a pure addition, no change here.
-->

<command>
  <name>mirage-orchestrate</name>
  <executable>mirage-orchestrate.sh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<active-response>
  <command>mirage-orchestrate</command>
  <location>local</location>
  <rules_group>mirage_mesh_decoy</rules_group>
</active-response>
