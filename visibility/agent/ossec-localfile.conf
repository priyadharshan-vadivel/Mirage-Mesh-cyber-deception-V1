<!--
  Mirage Mesh — Wazuh agent log ingestion.
  Add these <localfile> blocks INSIDE the <ossec_config> section of the Wazuh
  agent's /var/ossec/etc/ossec.conf (on the all-in-one VM this is the same host
  as the manager). Then restart wazuh-agent.

  Each decoy writes JSON events to its own file under /var/log/mirage-mesh.
  They are listed explicitly (not a wildcard) so the orchestration outputs in
  the same directory (orchestration.log, notifications.jsonl) are NOT ingested.
-->

<localfile>
  <log_format>json</log_format>
  <location>/var/log/mirage-mesh/fake_ssh.jsonl</location>
</localfile>

<localfile>
  <log_format>json</log_format>
  <location>/var/log/mirage-mesh/decoy_account.jsonl</location>
</localfile>

<localfile>
  <log_format>json</log_format>
  <location>/var/log/mirage-mesh/fake_login.jsonl</location>
</localfile>

<localfile>
  <log_format>json</log_format>
  <location>/var/log/mirage-mesh/honeytoken_file.jsonl</location>
</localfile>
